name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  msrv:
    name: Rust 1.90 build check (default + gpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Check default features
        run: cargo +1.90.0 check --locked --workspace --all-targets
      - name: Check GPU feature
        run: cargo +1.90.0 check --locked --workspace --all-targets --features modena-core/gpu

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (default + gpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `gpu` is pure-Rust (wgpu) and compiles without a GPU; `mpi` needs a
      # system MPI and is exercised in its own job below. Check both default
      # and gpu feature here.
      - name: cargo clippy (default)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy (gpu feature)
        run: cargo clippy --all-targets --features gpu -- -D warnings

  mpi:
    name: MPI backend (mpiexec -n 2)
    runs-on: ubuntu-latest
    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Clippy (mpi feature)
        run: cargo clippy --all-targets --features mpi -- -D warnings
      - name: Build MPI test
        run: cargo test --locked --features mpi --test mpi_decomp --no-run --message-format=json > "$RUNNER_TEMP/modena-mpi-artifacts.jsonl"
      - name: Run MPI test (mpiexec -n 2)
        # The decomposed force/energy/virial must match the serial reference
        # across two real MPI ranks. Single-process `cargo test` skips (see
        # `tests/mpi_decomp.rs`); this drives the genuine 2-rank path.
        # `--oversubscribe`: GitHub-hosted runners advertise a single slot, so
        # OpenMPI refuses to launch 2 ranks without it ("not enough slots
        # available"). `--allow-run-as-root` is required because the runner
        # executes as root.
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          messages = Path(os.environ['RUNNER_TEMP'], 'modena-mpi-artifacts.jsonl').read_text().splitlines()
          executables = {
              row['executable']
              for line in messages
              if (row := json.loads(line)).get('reason') == 'compiler-artifact'
              and row['target']['name'] == 'mpi_decomp'
              and row['profile']['test']
              and 'mpi' in row['features']
              and row.get('executable')
          }
          if len(executables) != 1:
              raise SystemExit(f'Expected one MPI test executable, found {len(executables)}')
          subprocess.run([
              'mpirun', '--oversubscribe', '--allow-run-as-root', '-n', '2',
              executables.pop(), '--nocapture',
          ], check=True)
          PY

  gpu:
    name: GPU backend (compile + skip-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (gpu feature; skips without adapter)
        # The wgpu backend compiles everywhere; on a headless CI runner there is
        # no GPU adapter, so the test self-skips. Run it to confirm the build +
        # graceful skip path.
        run: cargo test --features gpu --test gpu_pair

  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cargo build --verbose --release
      - name: Test
        run: cargo test --verbose
      - name: Python and benchmark-tool regression tests
        env:
          MODENA_BINARY: ${{ github.workspace }}/target/release/modena
        run: |
          python -m unittest discover -s python/modena/tests -v
          python -m unittest discover -s bench/tests -v
      - name: Bounded numerical scientific smoke
        run: |
          cargo build --release -p modena-core --example scientific_validation
          python bench/validate.py --output target/scientific-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-smoke-${{ matrix.os }}
          path: target/scientific-smoke
      - name: Run NVE smoke example
        # The workspace ships two binaries (`modena`, `modena-mcp`); pin the CLI
        # binary explicitly so `cargo run` never has to disambiguate.
        run: cargo run --release --bin modena -- run -i examples/argon_nve.toml

  bench-compile:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmarks (no-run)
        run: cargo bench --no-run
