name: Community

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const conventional = /^(feat|fix|docs|test|perf|refactor|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: \S(?:.*\S)?$/;
            if (!conventional.test(title)) {
              core.setFailed('Use a Conventional Commit title such as "fix(core): preserve force cache" or "docs: explain validation limits". See COMMIT_RULES.md.');
            }
