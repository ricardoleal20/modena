[workspace]
resolver = "2"
members = [
    "crates/modena-core",
    "crates/modena-cli",
    "crates/modena-bench",
    "crates/modena-mcp",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
authors = ["MODENA contributors"]
license = "MIT"
repository = "https://github.com/ricardoleal20/modena"
description = "A molecular dynamics engine in Rust, in early development."

[workspace.dependencies]
# Internal
modena-core = { path = "crates/modena-core", version = "0.1.1" }

# External
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
rayon = "1"
rustfft = "6.1"
num-complex = "0.4"
rand = "0.10"
rand_distr = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
chacha20 = { version = "0.10.2", default-features = false, features = ["rng"] }
libm = "0.2"
# Optional parallel/GPU backends (M9). Behind feature flags so the default build
# stays free of native MPI/GPU dependencies; CI exercises them in dedicated jobs.
mpi = { version = "0.8", package = "mpi" }
wgpu = "29"
# GPU backend helpers (M9, `gpu` feature only).
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
