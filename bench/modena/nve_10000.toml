# MODENA-vs-LAMMPS benchmark — GPU-d ladder: NVE LJ liquid, 10000 atoms.
# Matched to bench/lammps/in.nve_10000. Rectangular FCC block (10x10x25 cells
# = 2500 cells x 4 atoms) hits exactly 10000 atoms.

units = "reduced"

[structure]
type = "fcc"
lattice_constant = 1.6796
replicas = [10, 10, 25]   # 10000 atoms
element = "Ar"

[model]
type = "lennard_jones"
sigma = 1.0
epsilon = 1.0
cutoff = 2.5

[integrator]
type = "velocity_verlet"
dt = 0.005

[run]
steps = 2000
initial_temperature = 1.0
seed = 87287
trajectory_every = 2000
log_file = "nve_10000_energy.csv"
log_every = 100
