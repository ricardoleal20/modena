# MODENA-vs-LAMMPS benchmark — GPU-d ladder: NVE LJ liquid, 20000 atoms.
# Matched to bench/lammps/in.nve_20000. Rectangular FCC block (10x20x25 cells
# = 5000 cells x 4 atoms) hits exactly 20000 atoms.

units = "reduced"

[structure]
type = "fcc"
lattice_constant = 1.6796
replicas = [10, 20, 25]   # 20000 atoms
element = "Ar"

[model]
type = "lennard_jones"
sigma = 1.0
epsilon = 1.0
cutoff = 2.5

[integrator]
type = "velocity_verlet"
dt = 0.005

[run]
steps = 2000
initial_temperature = 1.0
seed = 87287
trajectory_every = 2000
log_file = "nve_20000_energy.csv"
log_every = 100
