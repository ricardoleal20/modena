# MODENA-vs-LAMMPS benchmark — Case 2: NVE LJ liquid, 2048 atoms.
# Matched to bench/lammps/in.nve_2048.

units = "reduced"

[structure]
type = "fcc"
lattice_constant = 1.6796
replicas = [8, 8, 8]   # 2048 atoms
element = "Ar"

[model]
type = "lennard_jones"
sigma = 1.0
epsilon = 1.0
cutoff = 2.5

[integrator]
type = "velocity_verlet"
dt = 0.005

[run]
steps = 5000
initial_temperature = 1.0
seed = 87287
trajectory_every = 5000
log_file = "nve_2048_energy.csv"
log_every = 500
