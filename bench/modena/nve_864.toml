# MODENA-vs-LAMMPS benchmark — Case 1: NVE LJ liquid, 864 atoms.
# Matched to bench/lammps/in.nve_864. Shifted-force LJ, reduced units,
# dt=0.005, 5000 steps, rho=0.8442 (a=1.6796).

units = "reduced"

[structure]
type = "fcc"
lattice_constant = 1.6796
replicas = [6, 6, 6]   # 864 atoms
element = "Ar"

[model]
type = "lennard_jones"
sigma = 1.0
epsilon = 1.0
cutoff = 2.5

[integrator]
type = "velocity_verlet"
dt = 0.005

[run]
steps = 5000
initial_temperature = 1.0
seed = 87287
trajectory_every = 5000   # only final frame (benchmark, not analysis)
log_file = "nve_864_energy.csv"
log_every = 500
