# MODENA vs LAMMPS validation — Ewald electrostatics on NaCl rocksalt.
# Matched to bench/validation/ewald/in.lammps.
#
# System: rocksalt (NaCl) structure, Na +1, Cl -1, 216 atoms, 3D periodic.
# Short-range: Buckingham (force-shifted in MODENA, energy-shifted in LAMMPS).
# Long-range: Ewald summation (same method, same kappa on both engines).
# Ensemble: NVE, velocity-Verlet, dt = 0.0025, 2000 steps.
#
# The Buckingham shift convention difference (force-shift vs energy-shift)
# produces a small systematic PE offset, quantified in VALIDATION.md —
# the same convention difference as the Buckingham validation. The Ewald
# (Coulomb) energy should agree closely since both engines use the same
# Ewald decomposition with the same kappa and real-space cutoff.

units = "reduced"

[structure]
type = "rock_salt"
lattice_constant = 5.0
replicas = [3, 3, 3]   # 3*3*3*8 = 216 atoms
cation = "Na"
anion = "Cl"
cation_charge = 1.0
anion_charge = -1.0

[model]
type = "buckingham"
cutoff = 5.0
# Two species (Na=0, Cl=1). Cross-pair uses an explicit override so both
# Na-Na, Na-Cl, and Cl-Cl have identical Buckingham parameters (A=1000,
# B=1, rho=0.3) — matching the LAMMPS pair_coeff block.
[[model.types]]
a = 1000.0
b = 1.0
rho = 0.3
[[model.types]]
a = 1000.0
b = 1.0
rho = 0.3
[[model.overrides]]
types = [0, 1]
a = 1000.0
b = 1.0
rho = 0.3

[electrostatics]
# kappa*rc = 4.0 -> erfc(kappa*rc) = 1.5e-8: the real-space truncation at the
# cutoff is negligible (standard Ewald practice). With kappa = 0.5
# (kappa*rc = 2.5, erfc = 4.1e-4) the 648 lattice pairs sitting exactly on the
# r = 5.0 cutoff sphere produce a coherent +0.026 energy jump on the first
# step — the classic truncated-Ewald discontinuity, which MODENA's
# ConservationReport surfaces as a drift warning (see VALIDATION.md §Ewald).
kappa = 0.8
real_cutoff = 5.0
kspace_cutoff = 7.0

[integrator]
type = "velocity_verlet"
dt = 0.0025

[run]
steps = 2000
initial_temperature = 0.1
seed = 87287
log_file = "results/modena_thermo.csv"
log_every = 100
trajectory_file = "results/modena_traj.xyz"
trajectory_every = 2000
