# MODENA vs LAMMPS validation — SHAKE/RATTLE bonded constraints.
# Matched to bench/validation/shake/in.lammps + data.trimers.
#
# System: 16 rigid water-like trimers (O + 2 H, all masses 1.0), 48 atoms,
# in a 10x10x10 periodic box. Each trimer is fully rigid: two O-H bonds of
# length 1.0 and the H-H 1-3 distance of 1.6329931618554521
# (= 2*sin(theta/2) with theta = 109.4712206 deg, the tetrahedral angle) —
# three distance constraints per trimer.
#
# LAMMPS mapping: fix shake b 1 a 1 constrains the two bonds (type 1) plus
# the angle (type 1); LAMMPS converts the angle constraint to the equivalent
# 1-3 distance constraint, so both engines solve the SAME constraint set
# (a rigid triangle per trimer). LAMMPS fix shake requires disconnected
# clusters, which is why the system is a set of isolated trimers rather
# than a chain.
#
# Non-bonded: LJ (sigma=1.0, epsilon=0.1, cutoff=2.5) with NO exclusions —
# bonded pairs feel the full LJ in both engines (LAMMPS: special_bonds
# lj 1 1 1). Harmonic bonds/angles are present with k = 0 (no force; SHAKE
# enforces rigidity), mirroring the LAMMPS bond/angle definitions.
#
# Ensemble: NVE, velocity-Verlet + SHAKE/RATTLE, dt = 0.005, 2000 steps.

units = "reduced"

[structure]
type = "xyz"
file = "trimers.xyz"
box_size = [10.0, 10.0, 10.0]
element = "O"
mass = 1.0

[model]
type = "lennard_jones"
sigma = 1.0
epsilon = 0.1
cutoff = 2.5

# k = 0 harmonic bonds/angles (topology mirrors the LAMMPS data file; the
# bonded force is zero — SHAKE does all the work).
[topology]
[[topology.bonds]]
