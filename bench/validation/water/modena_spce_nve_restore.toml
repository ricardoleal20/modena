# MODENA rigid SPC/E liquid water — Phase 2: NVE measurement from the
# equilibrated checkpoint.
#
# Restores the full mechanical state (box, positions, velocities, step
# counter — reduced units) written by modena_spce_nvt.toml, drops the
# thermostat, and runs NVE. The restored run's log/step labels continue from
# the checkpoint (first row is the seam step), so the two thermo CSVs
# concatenate into one continuous series.
#
#   modena run -i bench/validation/water/modena_spce_nvt.toml   (phase 1)
#   modena run -i bench/validation/water/modena_spce_nve_restore.toml
#
# The checkpoint must be written by the same structure (same n_waters) — an
# atom-count mismatch is a config error.

units = "real"

[structure]
type = "water"
n_waters = 64
density = 0.997
seed = 7

[model]
type = "lennard_jones"
cutoff = 9.0
[[model.types]]
sigma = 3.166
epsilon = 0.1553
[[model.types]]
sigma = 3.166
epsilon = 0.0

[electrostatics]
method = "spme"
kappa = 0.34
real_cutoff = 9.0
kspace_cutoff = 4.0

[integrator]
type = "velocity_verlet"
dt = 0.0005

[run]
steps = 2000
initial_temperature = 298.15
seed = 87287
log_file = "results/modena_spce_nve_thermo.csv"
log_every = 50
restart_mode = "state_only"
restore_file = "results/modena_spce_nvt.chk"
restart_file = "results/modena_spce_nve.chk"
restart_every = 500
