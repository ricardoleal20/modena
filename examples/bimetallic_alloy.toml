# MODENA example — Ar/Ne bimetallic random alloy, NVT (BAOAB-Langevin).
#
# Demonstrates the M2 features: real units (Å, kcal/mol, amu, K), multi-species
# pair potentials with Lorentz–Berthelot cross interactions, and the random-
# alloy structure builder. The core converts every field to reduced units at the
# I/O boundary and renders output (CSV/trajectory) back to real units.
#
# Species:
#   Ar: σ = 3.40 Å, ε = 0.238 kcal/mol, m = 39.948 amu, 80%
#   Ne: σ = 2.75 Å, ε = 0.072 kcal/mol, m = 20.180 amu, 20%
# Cross (Ar-Ne) defaults to Lorentz–Berthelot: σ_ij = 3.075, ε_ij = 0.131.
# The reference for unit conversion is the first type (Ar).

units = "real"

[structure]
type = "random_alloy"
lattice_constant = 5.26        # Å (~ Ar near-neighbor spacing)
replicas = [4, 4, 4]           # 256 atoms
seed = 42
[[structure.species]]
element = "Ar"
mass = 39.948
concentration = 0.8
[[structure.species]]
element = "Ne"
mass = 20.180
concentration = 0.2

[model]
type = "lennard_jones"
cutoff = 12.0                  # Å (≈ 3.5 σ_Ar)
[[model.types]]
sigma = 3.40
epsilon = 0.238
[[model.types]]
sigma = 2.75
epsilon = 0.072
# (Optional) explicit override of the Ar-Ne cross interaction:
# [[model.overrides]]
# types = [0, 1]
# sigma = 3.08
# epsilon = 0.13

[integrator]
type = "langevin_baoab"
dt = 0.002                     # ps
gamma = 1.0                    # 1/ps
target_temperature = 120.0     # K
seed = 7

[run]
steps = 5000
initial_temperature = 120.0    # K
seed = 42
trajectory_file = "bimetallic_alloy_traj.xyz"
trajectory_every = 100
log_file = "bimetallic_alloy_energy.csv"
log_every = 10
