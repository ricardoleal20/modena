# Physical inputs: Angstrom, ps, amu, e, kcal/mol, K. LJ shifted-force.
# Bond U=1/2 k(r-r0)^2, k in kcal/mol/Angstrom^2. Model types zero-based.
units="real"
[structure]
type="xyz"
file="chain.xyz"
box_size=[20.0,20.0,20.0]
[model]
type="lennard_jones"
cutoff=8.0
[[model.types]]
sigma=3.0
epsilon=0.2
[[model.types]]
sigma=1.0
epsilon=0.05
[integrator]
type="nose_hoover_chain"
dt=0.0001
target_temperature=100.0
tau=0.05
chain_len=3
[electrostatics]
method="ewald"
kappa=0.4
real_cutoff=8.0
kspace_cutoff=2.0
[topology]
lj_scales=[0.0,0.0,0.5]
coulomb_scales=[0.0,0.0,0.8333333333333333]
[[topology.bonds]]
atoms=[0,1]
r0=1.1
k=300.0
[[topology.bonds]]
atoms=[1,2]
r0=1.1
k=300.0
[[topology.bonds]]
atoms=[2,3]
r0=1.1
k=300.0
[run]
steps=10
initial_temperature=100.0
seed=42
neighbor_skin=1.0
log_every=5
log_file="results/continue.csv"
restore_file="results/molecular.chk"
restart_mode="continue"
restart_file="results/continue.chk"
restart_every=10
