# Physical input; Lorentz-Berthelot shifted-force LJ + SPME, elementary charges.
units="real"
[structure]
type="rock_salt"
lattice_constant=5.64
replicas=[2,2,2]
cation="Na"
anion="Cl"
cation_mass=22.98977
anion_mass=35.453
cation_charge=1.0
anion_charge=-1.0
[model]
type="lennard_jones"
cutoff=5.0
[[model.types]]
sigma=2.0
epsilon=0.05
[[model.types]]
sigma=3.5
epsilon=0.1
[electrostatics]
method="spme"
kappa=0.4
real_cutoff=5.0
kspace_cutoff=2.5
[integrator]
type="langevin_baoab"
dt=0.0001
gamma=1.0
target_temperature=100.0
seed=77
[run]
steps=10
initial_temperature=100.0
log_every=2
log_file="results/ionic.csv"
neighbor_skin=1.0
