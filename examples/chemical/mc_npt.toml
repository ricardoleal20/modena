# Reduced LJ units: sigma=epsilon=mass=kB=1; pressure epsilon/sigma^3.
units="reduced"
[structure]
type="fcc"
lattice_constant=2.4
replicas=[2,2,2]
element="Ar"
[model]
type="lennard_jones"
sigma=1.0
epsilon=1.0
cutoff=2.5
[integrator]
type="velocity_verlet"
dt=0.001
[thermostat]
type="velocity_rescaling"
target_temperature=1.0
tau=0.1
seed=123
[barostat]
type="monte_carlo"
target_pressure=0.1
target_temperature=1.0
max_log_volume=0.05
interval=2
seed=456
[run]
steps=20
initial_temperature=1.0
log_every=2
log_file="results/npt.csv"
