# Fixed-volume SPC/E water. Physical input; diagnostic pressure omits constraint impulses.
units="real"
[structure]
type="water"
n_waters=8
density=0.3
seed=42
[model]
type="lennard_jones"
cutoff=4.0
[[model.types]]
sigma=3.166
epsilon=0.1554
[[model.types]]
sigma=3.166
epsilon=0.0
[electrostatics]
method="spme"
kappa=0.4
real_cutoff=4.0
kspace_cutoff=2.0
[integrator]
type="velocity_verlet"
dt=0.0001
[thermostat]
type="velocity_rescaling"
target_temperature=100.0
tau=0.05
seed=42
[run]
steps=5
initial_temperature=100.0
log_every=1
log_file="results/water.csv"
