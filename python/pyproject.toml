[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modena"
version = "0.1.1"
description = "Configure and drive MODENA molecular-dynamics runs from Python (transport A: CLI subprocess)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MODENA contributors" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["molecular-dynamics", "atomistics", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/ricardoleal20/modena"
Repository = "https://github.com/ricardoleal20/modena"
Documentation = "https://github.com/ricardoleal20/modena/blob/main/python/README.md"
Issues = "https://github.com/ricardoleal20/modena/issues"
Changelog = "https://github.com/ricardoleal20/modena/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]  # Optional MCP client tooling; check()/run() use the CLI.

[tool.hatch.build.targets.wheel]
packages = ["modena"]
